# Skat: микшер, чтобы музыка, ответ ассистента и щелчки кнопок звучали одновременно (без dmix карту открывает один процесс)
pcm.dmixer {
    type dmix
    ipc_key 5978293
    ipc_perm 0666
    slave { pcm "hw:0,0"; format S16_LE; channels 1; rate 48000; period_size 1024; buffer_size 4096 }
}

pcm.micboost {
    type softvol
    slave.pcm "hw:0,1"
    control { name "Mic Boost Capture Volume"; card 0 }
    min_dB -5.0
    max_dB 40.0
    resolution 121
}

# The amplifier's own volume reaches the speaker alone. The 3.5 mm jack is a
# line output fed from the TDM lines by a converter of its own, so nothing in
# the amplifier can move it, and the only volume both share is one applied to
# the samples before they leave the SoC. The stock firmware solved it the same
# way, with the same range.
pcm.mastervol {
    type softvol
    slave.pcm "dmixer"
    control { name "Master Playback Volume"; card 0 }
    min_dB -60.0
    max_dB 0.0
    resolution 101
}

# Capture goes through the gain by default: the PDM block has no gain of its
# own, so anything opening the card straight would record whatever the
# microphones give. plug in front converts rate and channel count for callers
# that want something other than the native four channels at 48 kHz.
pcm.!default {
    type asym
    playback.pcm "plug:mastervol"
    capture.pcm "plug:micboost"
}
